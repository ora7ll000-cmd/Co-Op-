<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Co-Op | ألعاب جماعية</title>
  <meta name="description" content="تشكيلة هادية من الألعاب الجماعية على ستيم مع تصويت مباشر ولوحة تحكم للأدمن." />
  <meta property="og:title" content="Co-Op | ألعاب جماعية" />
  <meta property="og:description" content="تشكيلة هادية من الألعاب الجماعية على ستيم مع تصويت مباشر ولوحة تحكم للأدمن." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,900;1,700&family=Inter:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/index.css">
</head>
<body>
  <div id="splash"><span>Co-Op</span></div>
  <div id="abar">
    <span>🔐 وضع الأدمن — أي تعديل يظهر للكل مباشرة</span>
    <span class="sv idle" id="sv">متصل</span>
    <button id="aex">👁️ عرض كمتفرج</button>
  </div>
  <nav>
    <div class="logo">Co-Op</div>
    <div class="ico">
      <button id="bs" aria-label="بحث">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button id="bv" aria-label="الأكثر تصويتاً">
        <svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>
        <span class="nb z" id="nb">0</span>
      </button>
      <button id="bm" class="bm" aria-label="التنقل السريع">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div id="sbar"><input id="q" placeholder="ابحث عن لعبة..."></div>

  <section class="hero">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <h1 id="h1"></h1>
    <h2>Collection</h2>
    <p>تشكيلة هادية من الألعاب الجماعية اللي تجمع أخوياك وتضيف الحماس لسهراتكم</p>
  </section>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all">الكل</button>
    <button class="chip" data-f="sale">🏷️ العروض</button>
    <button class="chip" data-f="fav">♥ المفضلة</button>
    <button class="chip" data-f="lo">الأرخص</button>
    <button class="chip" data-f="hi">الأغلى</button>
    <button class="chip" id="vchip">الأكثر تصويتاً<span class="cb" id="vcb"></span></button>
    <div class="sizes" id="sizes"></div>
  </div>
  <div class="grid" id="grid"></div>
  <footer>
    <div class="ft-txt">
      <span>اضغط على أي لعبة لعرض تفاصيلها،</span>
      <span>ومنها تنتقل إلى ستيم 🎮</span>
    </div>
    <div id="stamp" class="stamp"></div>
  </footer>

  <div id="det">
    <div class="det-nav">
      <button class="back" id="bk">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <span>رجوع للمجموعة</span>
      </button>
      <button class="dvt" id="dvt" aria-label="عرض قائمة الأكثر تصويتاً">
        <svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>
        <span class="tx">قائمة الأكثر تصويتاً</span>
      </button>
    </div>
    <div class="dg" id="dg"></div>
    <div id="dx"></div>
  </div>

  <div id="lb">
    <div id="lbb"></div>
    <div id="lbamb"></div>
    <div id="lbs"></div>
    <button id="lbx" class="lbui" aria-label="إغلاق"><span></span><span></span></button>
    <button id="lbnx" class="lbn lbui" aria-label="التالي"><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>
    <button id="lbp" class="lbn lbui" aria-label="السابق"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
    <div id="lbcnt" class="lbui"></div>
    <div id="lbc" class="lbui"></div>
    <div id="lbh" class="lbui">اضغط على الصورة للتقريب · الأسهم للتنقل · Esc للإغلاق</div>
  </div>

  <div id="vp">
    <div class="vc">
      <button class="gskip" id="vpx">إغلاق</button>
      <h2>الأكثر تصويتاً</h2>
      <small id="vps"></small>
      <div id="vpl"></div>
      <div id="vpa"></div>
    </div>
  </div>

  <div id="shade"></div>
  <div id="menu"></div>
  <div id="toast"></div>

  <dialog id="cdlg">
    <p id="cmsg" style="margin:0 0 18px;font-size:17px;line-height:1.8"></p>
    <div class="row">
      <button class="btn" id="cok" style="flex:1;padding:13px">تأكيد</button>
      <button class="btn out" id="cno" style="padding:13px 20px">إلغاء</button>
    </div>
  </dialog>

  <dialog id="pdlg">
    <form id="pf">
      <h3 id="pt">دخول الأدمن</h3>
      <p id="pp" style="color:var(--mut);margin:6px 0 4px"></p>
      <input id="pw" type="password" autocomplete="off" placeholder="كلمة السر">
      <input id="pw2" type="password" autocomplete="off" placeholder="أعد كتابتها" style="display:none;margin-top:10px">
      <div class="row" style="margin-top:18px">
        <button type="submit" class="btn" style="flex:1;padding:14px">تأكيد</button>
        <button type="button" class="btn out" id="pcx" style="padding:14px 22px">إلغاء</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg">
    <form method="dialog" id="f">
      <h3 id="dt">لعبة</h3>
      <label>اسم اللعبة</label><input id="fn" required>
      <div class="row">
        <div><label>السعر (SR)</label><input id="fp" type="number" step="0.01" min="0" required></div>
        <div><label>قبل الخصم (اختياري)</label><input id="fo" type="number" step="0.01" min="0"></div>
      </div>
      <div class="row">
        <div><label>عدد اللاعبين</label><input id="fpl" placeholder="مثال: 1-4"></div>
        <div><label>الترتيب</label><input id="fr" type="number" min="1"></div>
      </div>
      <label>رابط ستيم (اختياري)</label><input id="fl" dir="ltr" placeholder="https://store.steampowered.com/app/...">
      <label>هدف اللعبة</label><textarea id="fg" rows="2" maxlength="300" placeholder="وش المطلوب من اللاعبين؟"></textarea>
      <label>صورة الغلاف</label>
      <div class="pz" id="pz"></div>
      <input id="fi" type="file" accept="image/*" hidden>
      <div class="row" style="margin-top:20px">
        <button type="submit" class="btn" style="flex:1;padding:14px">حفظ</button>
        <button type="button" class="btn out" id="cx" style="padding:14px 22px">إلغاء</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
