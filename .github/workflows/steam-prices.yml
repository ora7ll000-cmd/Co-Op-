name: Refresh Saudi Steam prices and media
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main, feature/steam-trailers-coop-catalog-2026]
    paths:
      - '.github/workflows/steam-prices.yml'
      - 'scripts/update-steam-prices.mjs'
      - 'src/extraGames.ts'
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check official Saudi prices and game trailers
        run: node scripts/update-steam-prices.mjs
      - name: Commit validated price changes
        run: |
          if ! git diff --quiet -- src/steamPrices.json src/steamMedia.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/steamPrices.json src/steamMedia.json
            git commit -m "chore: sync verified Saudi prices and official Steam media"
            git push
          fi
