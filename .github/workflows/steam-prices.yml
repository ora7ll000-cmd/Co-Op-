name: Refresh Saudi Steam prices
on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check official Steam prices (SAR)
        run: node scripts/update-steam-prices.mjs
      - name: Commit validated price changes
        run: |
          if ! git diff --quiet -- src/steamPrices.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/steamPrices.json
            git commit -m "chore: update verified Saudi Steam prices"
            git push
          fi
