name: Verify Co-Op catalog
on:
  push:
    branches: [feature/restore-catalog-keep-navy-design-2026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check scripts/update-steam-prices.mjs
      - run: npx --yes wrangler@4 deploy --dry-run
